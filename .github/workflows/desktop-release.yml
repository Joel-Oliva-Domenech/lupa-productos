name: Publicar aplicaciones de escritorio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Preparar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar pruebas y compilar
        run: pnpm check

  empaquetar:
    needs: validar
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: desktop-windows
            comando: pnpm desktop:dist:win
            archivos: release/*.exe
          - os: macos-latest
            nombre: desktop-macos-intel
            comando: pnpm desktop:dist:mac:x64
            archivos: release/*.dmg
          - os: macos-latest
            nombre: desktop-macos-apple-silicon
            comando: pnpm desktop:dist:mac:arm64
            archivos: release/*.dmg

    runs-on: ${{ matrix.os }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Preparar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Crear instalador
        run: ${{ matrix.comando }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Guardar instalador
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.nombre }}
          path: ${{ matrix.archivos }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: empaquetar
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar instaladores
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Crear sumas SHA-256
        shell: bash
        run: |
          find release-assets -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' \) -print0 |
            sort -z |
            xargs -0 sha256sum > release-assets/SHA256SUMS.txt

      - name: Publicar versión
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/*
          --verify-tag
          --generate-notes
          --title "Lupa ${GITHUB_REF_NAME#v}"

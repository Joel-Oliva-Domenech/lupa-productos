name: Calidad

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Preparar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar pruebas
        run: pnpm test

      - name: Compilar PWA
        run: pnpm build
